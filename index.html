<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0f0a14;
    --bg2: #2a1424;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --text: #f6efe6;
    --muted: #b9aaa0;
    --accent: #e0a64b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 15% 0%, rgba(224, 166, 75, 0.18), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(150, 40, 80, 0.25), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px 32px;
  }
  header { width: 100%; max-width: 720px; text-align: center; }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: #1a1010; border-color: var(--accent); font-weight: 600; }

  .progress-row { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 560px; margin: 0 auto 22px; }
  .progress { flex: 1; height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #f4d38f); transition: width .3s; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 70px; text-align: right; }

  .scene { width: 100%; max-width: 560px; aspect-ratio: 7 / 5; perspective: 1400px; cursor: pointer; }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2, .8, .2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    backdrop-filter: blur(12px);
    box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; text-align: center; overflow: hidden;
  }
  .face::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
    background: var(--group-color, var(--accent));
  }
  .back { transform: rotateY(180deg); }
  .tag {
    position: absolute; top: 20px; left: 22px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--group-color, var(--accent)); font-weight: 600;
  }
  .side-label { position: absolute; top: 20px; right: 22px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .name {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 800;
    font-size: clamp(30px, 7vw, 54px);
    line-height: 1.1;
    margin: 0;
  }
  .hint { color: var(--muted); font-style: italic; margin-top: 10px; font-size: 16px; min-height: 1em; }
  .category {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 800;
    font-size: clamp(28px, 6.5vw, 48px);
    line-height: 1.15;
    color: var(--group-color, var(--accent));
    margin: 0;
  }
  .back-name { color: var(--muted); font-size: 15px; margin-bottom: 10px; letter-spacing: .5px; }
  .note {
    margin-top: 14px; font-size: 15px; color: var(--text);
    background: rgba(255,255,255,.08); padding: 6px 14px; border-radius: 99px;
  }
  .note:empty { display: none; }
  .speak {
    margin-top: 22px;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.08);
    color: var(--text);
    border-radius: 999px;
    padding: 10px 18px;
    font: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .speak:hover { background: var(--group-color, var(--accent)); color: #1a1010; border-color: transparent; }
  .speak.speaking { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(224,166,75,.15); } }
  .speak svg { width: 18px; height: 18px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
  .actions .speak { margin-top: 0; }

  .controls { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 14px;
    font: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: #1a1010; border-color: var(--accent); }
  .btn.toggle.active { border-color: var(--accent); color: var(--accent); }

  .keys { margin-top: 22px; color: var(--muted); font-size: 13px; text-align: center; line-height: 2; }
  kbd {
    display: inline-block; min-width: 24px; padding: 1px 7px;
    border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 6px; background: rgba(255,255,255,.06);
    font-family: inherit; font-size: 12px; color: var(--text);
  }

  @media (max-width: 520px) {
    .scene { aspect-ratio: 4 / 5; }
    .btn { padding: 11px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Bar <span>Flashcards</span></h1>
  <p class="subtitle">Say the brand name with its category, every time.</p>
  <div class="chips" id="chips"></div>
  <div class="progress-row">
    <div class="progress"><div id="bar"></div></div>
    <div class="count" id="count">0 / 0</div>
  </div>
</header>

<div class="scene" id="scene" title="Click to flip">
  <div class="card" id="card">
    <div class="face front">
      <div class="tag" id="tagFront"></div>
      <div class="side-label">Brand</div>
      <p class="name" id="name"></p>
      <div class="hint" id="hint"></div>
      <div class="actions">
      <button class="speak" id="speakFront" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        Pronounce
      </button>
      </div>
    </div>
    <div class="face back">
      <div class="tag" id="tagBack"></div>
      <div class="side-label">Category</div>
      <div class="back-name" id="backName"></div>
      <p class="category" id="category"></p>
      <div class="note" id="note"></div>
      <div class="actions">
      <button class="speak" id="speakBack" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        Say name + category
      </button>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="prev" type="button">&#9664; Prev</button>
  <button class="btn primary" id="flip" type="button">Flip</button>
  <button class="btn" id="next" type="button">Next &#9654;</button>
  <button class="btn toggle" id="shuffle" type="button">Shuffle</button>
</div>

<div class="keys">
  <kbd>&larr;</kbd> <kbd>&uarr;</kbd> previous &nbsp;·&nbsp;
  <kbd>&rarr;</kbd> <kbd>&darr;</kbd> next &nbsp;·&nbsp;
  <kbd>Space</kbd> flip &nbsp;·&nbsp;
  <kbd>S</kbd> speak
</div>


<script>
// ---- Data (transcribed from pictures/IMG_5032–5035) ----
// Entry forms: "Name" | ["Name", "note"] | { n, note, say, hint }
const GROUPS = {
  Whiskey: "#e0a64b",
  Spirits: "#6fc3d6",
  Liqueur: "#c38cf0",
  Wine:    "#e0627a",
  Beer:    "#f2cf5b",
};

const SECTIONS = [
  ["Whiskey", "Bourbon Whiskey", ["Angel's Envy", "Basil Hayden's", "Wild Turkey", "Four Roses", "Jim Beam",
    "Maker's Mark", "Buffalo Trace", "Knob Creek", "Woodford Reserve", "Bulleit"]],
  ["Whiskey", "American Blended Whiskey", [{ n: "Seagram's 7", say: "Seagram's Seven" }]],
  ["Whiskey", "Tennessee Whiskey", ["Jack Daniel's"]],
  ["Whiskey", "Cinnamon Whiskey", ["Fireball"]],
  ["Whiskey", "Canadian Whiskey", ["Windsor", "Canadian Club", "Pendleton", "Crown Royal"]],
  ["Whiskey", "Irish Whiskey", ["Jameson", { n: "2 Gingers", say: "Two Gingers" }, "Tullamore Dew", "Bushmills"]],
  ["Whiskey", "Rye Whiskey", ["Sazerac", "Rittenhouse", "Old Overholt", "Templeton", "Bulleit"]],
  ["Whiskey", "Blended Scotch", ["Cutty Sark", "Chivas Regal", "Dewar's White Label",
    "Johnnie Walker Red Label", "Johnnie Walker Black Label", "Johnnie Walker Blue Label"]],
  ["Whiskey", "Single Malt Scotch", ["Glenfiddich", "Glenlivet", "Macallan"]],

  ["Spirits", "Tequila", ["Don Julio", "Herradura", { n: "Patron", say: "Patrón" },
    { n: "1800", say: "Eighteen hundred" }, "Casamigos", { n: "Espolon", say: "Espolón" }, "El Jimador",
    "Milagro", { n: "Jose Cuervo", say: "José Cuervo" }]],
  ["Spirits", "Gin", ["Hendrick's", "Roku", "Tanqueray", "Bombay Sapphire", "Aviation", "Beefeater"]],
  ["Spirits", "Vodka", ["Belvedere", "Ketel One", "Grey Goose", "Tito's", "Stoli", "Absolut",
    { n: "Ciroc", say: "Cîroc" }, { n: "Skyy", say: "Sky" }, "Prairie", "Smirnoff"]],
  ["Spirits", "Rum", ["Bacardi", "Mount Gay", "Bumbu"]],
  ["Spirits", "Citrus-Flavored Rum", ["Bacardi Limon"]],
  ["Spirits", "Spiced Rum", ["Captain Morgan"]],
  ["Spirits", "Coconut Rum", ["Malibu"]],
  ["Spirits", "Dark Rum", ["Myers's"]],
  ["Spirits", "Black Rum", ["Gosling's"]],

  ["Liqueur", "Brandy", ["Christian Brothers", { n: "E&J", say: "E and J" }, "Korbel", { n: "Blackberry Flavored" }]],
  ["Liqueur", "Cognac Brandy", ["Courvoisier", "Hennessy", "Martell", { n: "Remy Martin", say: "Rémy Martin" }]],
  ["Liqueur", "Schnapps (Liqueur)", ["Raspberry", "Peach", "Sour Apple", "Root Beer", "Butterscotch", "Peppermint",
    { n: "Rumple Minze", note: "Peppermint" }]],
  ["Liqueur", "Liqueur", [
    ["Chambord", "Raspberry"],
    ["Grand Marnier", "Orange"],
    ["Cointreau", "Orange"],
    ["Triple Sec", "Orange"],
    { n: "Blue Curacao", note: "Orange", say: "Blue Curaçao" },
    ["Midori", "Melon"],
    ["Southern Comfort", "Whiskey / Fruit / Spice"],
    ["Drambuie", "Scotch / Honey"],
    { n: "Creme de Menthe", note: "Mint", say: "Crème de Menthe" },
    { n: "Dr. McGillicuddy's Mentholmint", note: "Mentholmint", say: "Doctor McGillicuddy's Mentholmint" },
    { n: "Dr. McGillicuddy's Cherry", note: "Cherry", say: "Doctor McGillicuddy's Cherry" },
    { n: "Creme de Cacao", note: "Chocolate", say: "Crème de Cacao" },
    ["Disaronno", "Almond / Premium Amaretto"],
    ["Amaretto", "Almond"],
    ["Frangelico", "Hazelnut"],
    ["Kahlua", "Rum / Coffee"],
    ["Bailey's", "Irish Cream"],
    ["RumChata", "Rum / Cinnamon / Cream"],
    { n: "St. Germain", note: "Elderflower", say: "St-Germain" },
    ["Sambuca", "Licorice"],
    { n: "Jagermeister", note: "Herbal / Licorice", say: "Jägermeister" },
    ["Aperol", "Herbal / Bitter / Orange"],
    ["Campari", "Herbal / Bitter / Orange / Cherry"],
    ["Fernet-Branca", "Herbal / Bitter / Licorice"],
    { n: "B&B", note: "Brandy / Dry / Spicy", say: "B and B" },
  ]],

  ["Wine", "Sparkling Wine", [
    { n: "Champagne", hint: "sham-PAYN" }, { n: "Cava", hint: "KAH-vuh" }, { n: "Prosecco", hint: "proh-SECK-oh" },
    { n: "Moscato d'Asti", hint: "moh-SKAH-toh DAH-stee" }, { n: "Asti Spumante", hint: "AH-stee spoo-MAHN-tay" }]],
  ["Wine", "Red Wine", [
    { n: "Cabernet Sauvignon", hint: "ka-ber-NAY so-vin-YAWN" }, { n: "Chianti", hint: "kee-AHN-tee" },
    { n: "Malbec", hint: "mal-bek" }, { n: "Shiraz", hint: "she-RAAZ" }, { n: "Zinfandel", hint: "zin-fuhn-del" },
    { n: "Pinot Noir", hint: "PEE-no NWAR" }, { n: "Merlot", hint: "mur-LOW" }]],
  ["Wine", "White Wine", [
    { n: "Sauvignon Blanc", hint: "so-vin-YAWN blonk" }, { n: "Chardonnay", hint: "SHAR-duh-nay" },
    { n: "Pinot Grigio", hint: "PEE-no GREE-zhee-ow" }, { n: "Riesling", hint: "REEZ-ling" },
    { n: "Moscato", hint: "moh-SKAH-toh" }]],
  ["Wine", "Blush / Rosé Wine", [{ n: "Rosé", hint: "row-ZAY" }, { n: "White Zinfandel", hint: "white zin-fuhn-del" }]],

  ["Beer", "Lager Beer", [
    "Budweiser", "Bud Light", "Bud Light Lime", "Coors", "Coors Light", "Grain Belt", "Grain Belt Nordeast",
    "Hamm's", "Leinenkugel's", "Michelob Golden Light",
    "Michelob Ultra", "Miller High Life", "Miller Genuine Draft", "Miller Lite",
    { n: "Pabst Blue Ribbon", note: "PBR" }, "Samuel Adams", "Surly Hell",
    ["Fosters", "Australia"], ["Stella Artois", "Belgium"], ["Labatt Blue", "Canada"],
    ["St. Pauli Girl", "Germany"], ["Heineken", "Holland"], ["Red Stripe", "Jamaica"], ["Sapporo", "Japan"],
    ["Corona", "Mexico"], ["Dos Equis", "Mexico"],
    ["Dos Equis Amber", "Mexico"], ["Modelo", "Mexico"],
    ["Modelo Negra", "Mexico"], ["Pacifico", "Mexico"]]],
  ["Beer", "Ale Beer", [
    "Blue Moon", "Fat Tire", "Indeed Day Tripper", "Lift Bridge Farm Girl", "Fulton Lonely Blonde", "Oberon",
    { n: "Summit Extra Pale Ale", note: "EPA" }, "Surly Xtra-Citra", "Shock Top", ["Newcastle", "Holland"]]],
  ["Beer", "I.P.A. Beer", [
    "Hazy Little Thing", "Deschutes Fresh Squeezed", "Lagunitas IPA", "Lift Bridge Hop Dish", "Summit Saga",
    "Surly Axe Man", "Surly Furious", "Fulton Sweet Child of Vine", "Two Hearted", "Voodoo Ranger"]],
  ["Beer", "Stout Beer", [{ n: "Nitro", note: "Milk Stout" }, ["Guinness", "Ireland"]]],
  ["Beer", "Hard Cider", ["Angry Orchard", "Crispin", "Strongbow"]],
  ["Beer", "Hard Seltzer", ["Truly", "White Claw"]],
  ["Beer", "Non-Alcoholic Beer", [{ n: "O'Doul's", note: "Only produces NA beers" }]],
];

const ALL = SECTIONS.flatMap(([group, category, items]) => items.map(it => {
  if (typeof it === "string") it = { n: it };
  else if (Array.isArray(it)) it = { n: it[0], note: it[1] };
  return { name: it.n, category, group, note: it.note || "", hint: it.hint || "", say: it.say || it.n };
}));

// ---- State ----
const $ = id => document.getElementById(id);
let filter = "All";
let shuffled = false;
let deck = [];
let idx = 0;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem("barFlashcards") || "{}");
    if (s.filter && (s.filter === "All" || GROUPS[s.filter])) filter = s.filter;
    shuffled = !!s.shuffled;
    idx = s.idx || 0;
  } catch (e) {}
}
function save() {
  try { localStorage.setItem("barFlashcards", JSON.stringify({ filter, shuffled, idx })); } catch (e) {}
}

function buildDeck(keepIdx) {
  deck = ALL.filter(c => filter === "All" || c.group === filter);
  if (shuffled) {
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
  }
  if (!keepIdx) idx = 0;
  idx = Math.min(Math.max(idx, 0), deck.length - 1);
}

function renderChips() {
  const names = ["All", ...Object.keys(GROUPS)];
  $("chips").innerHTML = "";
  names.forEach(g => {
    const b = document.createElement("button");
    b.className = "chip" + (g === filter ? " active" : "");
    const n = g === "All" ? ALL.length : ALL.filter(c => c.group === g).length;
    b.textContent = `${g === "Liqueur" ? "Brandy & Liqueur" : g} · ${n}`;
    b.onclick = () => { filter = g; buildDeck(false); renderChips(); render(); };
    $("chips").appendChild(b);
  });
  $("shuffle").classList.toggle("active", shuffled);
}

function render() {
  const c = deck[idx];
  $("card").classList.remove("flipped");
  const color = GROUPS[c.group];
  $("scene").style.setProperty("--group-color", color);
  // Delay content swap slightly if mid-flip so the answer isn't visible while rotating back
  $("name").textContent = c.name;
  $("hint").textContent = c.hint ? `{ ${c.hint} }` : "";
  $("tagFront").textContent = c.group === "Liqueur" ? "Brandy & Liqueur" : c.group;
  $("tagBack").textContent = $("tagFront").textContent;
  setTimeout(() => {
    $("backName").textContent = c.name;
    $("category").textContent = c.category;
    $("note").textContent = c.note;
  }, 150);
  $("count").textContent = `${idx + 1} / ${deck.length}`;
  $("bar").style.width = `${((idx + 1) / deck.length) * 100}%`;
  save();
}

function go(delta) {
  idx = (idx + delta + deck.length) % deck.length;
  stopAudio();
  render();
}
function flip() { $("card").classList.toggle("flipped"); }

// ---- Speech ----
// Clips in audio/ are Google Translate pronunciations downloaded by generate_audio.py.
// slug() and categorySpeech() must match the Python script.
function slug(text) {
  return text.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
const categorySpeech = cat => cat.replace(/[\/()]/g, " ").replace(/\s+/g, " ").trim();

const player = new Audio();
let playToken = 0;

function stopAudio() {
  playToken++;
  player.pause();
  speechSynthesis.cancel();
  document.querySelectorAll(".speak.speaking").forEach(b => b.classList.remove("speaking"));
}

// Fallback when a clip is missing (e.g. a newly added card before re-running the script)
function ttsFallback(text) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.onend = u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function playClip(text, token) {
  return new Promise(resolve => {
    if (token !== playToken) return resolve();
    player.src = `audio/${slug(text)}.mp3`;
    player.onended = resolve;
    player.onerror = () => ttsFallback(text).then(resolve);
    player.play().catch(() => {});
  });
}

async function play(texts, btn) {
  stopAudio();
  const token = playToken;
  btn && btn.classList.add("speaking");
  for (const t of texts) {
    if (token !== playToken) return;
    await playClip(t, token);
  }
  if (token === playToken && btn) btn.classList.remove("speaking");
}

const sayFront = () => play([deck[idx].say], $("speakFront"));
const sayBack = () => play([deck[idx].say, categorySpeech(deck[idx].category)], $("speakBack"));
function speakCurrent() {
  $("card").classList.contains("flipped") ? sayBack() : sayFront();
}

// ---- Events ----
$("scene").addEventListener("click", flip);
$("speakFront").addEventListener("click", e => { e.stopPropagation(); sayFront(); });
$("speakBack").addEventListener("click", e => { e.stopPropagation(); sayBack(); });
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("flip").onclick = flip;
$("shuffle").onclick = () => { shuffled = !shuffled; buildDeck(false); renderChips(); render(); };

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case "ArrowRight": case "ArrowDown": go(1); break;
    case "ArrowLeft": case "ArrowUp": go(-1); break;
    case " ": case "Enter": flip(); break;
    case "s": case "S": speakCurrent(); break;
    default: return;
  }
  e.preventDefault();
});

load();
buildDeck(true);
renderChips();
render();
</script>
</body>
</html>
